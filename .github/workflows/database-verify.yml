name: database-verify

on:
  push:
    branches: [main, pos/01-perla-claro, pos/02-inicio-visual, pos/04-wiswellart-sales-sync]
  pull_request:
    branches: [main, pos/01-perla-claro]
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db supabase/tests/database/personal_os_completion.sql
