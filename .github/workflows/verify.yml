name: verify

on:
  push:
    branches: [main, pos/01-perla-claro, pos/02-inicio-visual, pos/03-life-activity-feed, pos/04-wiswellart-sales-sync]
  pull_request:
    branches: [main, pos/01-perla-claro, pos/02-inicio-visual]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --frozen-lockfile
      - run: bun run build
