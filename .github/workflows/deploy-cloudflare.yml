name: Verify Personal OS build (production deploy handled by Cloudflare Builds)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify build
        run: bun run build
